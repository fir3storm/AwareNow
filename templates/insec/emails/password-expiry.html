<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Password expires today</title></head>
<body style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#222;line-height:1.5;">
<p>Hi {{.FirstName}},</p>
<p>Your domain password for <strong>{{.Email}}</strong> expires at midnight. After that, Outlook and VPN will stop working until you reset it.</p>
<p style="margin:24px 0;">
  <a href="{{.URL}}" style="background:#a32d2d;color:#fff;padding:10px 18px;text-decoration:none;border-radius:4px;display:inline-block;">Reset password now</a>
</p>
<p>This link is unique to your account and expires in 4 hours.</p>
<p>IT Support</p>
{{.Tracker}}
</body>
</html>
